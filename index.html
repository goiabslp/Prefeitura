            '4k': '2200px',

  <style>
    @keyframes queueBorderPulse {
      0%, 100% {
        border-color: rgba(168, 85, 247, 0.95);
        box-shadow: 0 0 12px rgba(168, 85, 247, 0.45);
      }
      50% {
        border-color: rgba(168, 85, 247, 0.35);
        box-shadow: 0 0 4px rgba(168, 85, 247, 0.15);
      }
    }

    @keyframes progressShrink {
      from { width: 100%; }
      to { width: 0%; }
    }

    .animate-queue-pulse {
      animation: queueBorderPulse 2s ease-in-out infinite;
    }

    .animate-progress-shrink {
      animation: progressShrink 7s linear forwards;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    [contenteditable]:empty:before {
      content: attr(placeholder);
      color: #94a3b8;
      cursor: text;
    }
  </style>
  <script type="importmap">

  "imports": {

<body class="bg-slate-50 text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>
  <div id="pwa-install-banner" class="hidden md:hidden fixed bottom-4 left-4 right-4 z-[9999] bg-slate-900 text-white p-4 rounded-2xl shadow-2xl border border-indigo-500/30 flex items-center justify-between gap-3 animate-slide-up">
    <div class="flex items-center gap-3">
      <img src="/icon-192.png" alt="App Icon" class="w-10 h-10 rounded-xl shadow-md" />
      <div>
        <h4 class="text-xs font-black uppercase tracking-wider text-white">Instalar Aplicativo</h4>
        <p class="text-[11px] text-slate-300 leading-tight">Adicione à tela inicial do seu celular</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="pwa-install-btn" class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl shadow-md transition-all active:scale-95">
        Instalar
      </button>
      <button id="pwa-close-btn" class="p-2 text-slate-400 hover:text-white text-xs font-bold">
        ✕
      </button>
    </div>
  </div>

  <script type="module" src="/index.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
          .then(reg => {
            reg.update();
            console.log('PWA Service Worker ativo e atualizado:', reg.scope);
          })
          .catch(err => {
            console.error('Erro ao registrar Service Worker:', err);
          });
      });
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const isMobile = window.innerWidth < 768 || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
      const banner = document.getElementById('pwa-install-banner');
      if (banner && isMobile) banner.classList.remove('hidden');
    });

    document.getElementById('pwa-install-btn')?.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          console.log('PWA Instalado pelo usuário');
        }
        deferredPrompt = null;
        document.getElementById('pwa-install-banner')?.classList.add('hidden');
      }
    });

    document.getElementById('pwa-close-btn')?.addEventListener('click', () => {
      document.getElementById('pwa-install-banner')?.classList.add('hidden');
    });
  </script>
</body>

</html>
